<!DOCTYPE html>
<!-- saved from url=(0012)about:srcdoc -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      html, body { background: transparent; overflow: hidden; display: flex; justify-content: center; }
      .card {
        width: 100%;
        max-width: 440px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 24px;
        color: #ffffff;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      }
      .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
      .title-wrap { display: flex; gap: 10px; align-items: flex-start; }
      .icon { font-size: 24px; line-height: 1; }
      h3 { margin: 0; font-size: 18px; font-weight: 700; color: #ffffff; }
      p { margin: 4px 0 0; font-size: 13px; color: #94a3b8; }
      .stat { text-align: right; }
      .stat-num { color: #f59e0b; font-size: 22px; font-weight: 800; line-height: 1; }
      .stat-label { color: #64748b; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; margin-top: 3px; }
      .progress-track { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; margin: 18px 0 20px; overflow: hidden; }
      .progress-fill { width: 0%; height: 100%; background: #2563eb; border-radius: 999px; transition: width 0.25s ease; }
      .list { display: flex; flex-direction: column; gap: 10px; }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px 16px;
        border-radius: 14px;
        cursor: pointer;
        user-select: none;
      }
      .item:hover { background: rgba(255, 255, 255, 0.07); }
      input[type="checkbox"] { width: 18px; height: 18px; accent-color: #2563eb; cursor: pointer; flex-shrink: 0; }
      .item-text { font-size: 13.5px; font-weight: 500; color: #e2e8f0; line-height: 1.4; }
      em { font-style: italic; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="title-wrap">
          <span class="icon">📋</span>
          <div>
            <h3>Freshers Readiness Deck</h3>
            <p>Prepare before you step into University</p>
          </div>
        </div>
        <div class="stat">
          <div id="pText" class="stat-num">0%</div>
          <div class="stat-label">COMPLETED</div>
        </div>
      </div>

      <div class="progress-track">
        <div id="pBar" class="progress-fill"></div>
      </div>

      <div class="list">
        <label class="item"><input type="checkbox" class="chk"><span class="item-text">Original GCE O/L Certificate</span></label>
        <label class="item"><input type="checkbox" class="chk"><span class="item-text">Original GCE A/L Certificate <em>(if applicable)</em></span></label>
        <label class="item"><input type="checkbox" class="chk"><span class="item-text">National Identity Card</span></label>
        <label class="item"><input type="checkbox" class="chk"><span class="item-text">Parent or Guardian NIC</span></label>
        <label class="item"><input type="checkbox" class="chk"><span class="item-text">Birth Certificate</span></label>
        <label class="item"><input type="checkbox" class="chk"><span class="item-text">Original School Leaving Certificate <em>(if applicable)</em></span></label>
      </div>
    </div>

    <script>
      const checks = document.querySelectorAll(".chk");
      const pText = document.getElementById("pText");
      const pBar = document.getElementById("pBar");

      checks.forEach(box => {
        box.addEventListener("change", () => {
          const checked = document.querySelectorAll(".chk:checked").length;
          const pct = Math.round((checked / checks.length) * 100);
          pText.textContent = pct + "%";
          pBar.style.width = pct + "%";
        });
      });
    </script>
  
  
</body></html>
